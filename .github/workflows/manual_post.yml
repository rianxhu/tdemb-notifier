name: Manual Discord post

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "A TikTok videó teljes linkje"
        required: true
      title:
        description: "Videó címe/leírása (opcionális)"
        required: false
        default: "Új TikTok videó"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VIDEO_URL: ${{ inputs.video_url }}
          TITLE: ${{ inputs.title }}
        run: |
          EMBED_URL="${VIDEO_URL//tiktok.com/tnktok.com}"
          PAYLOAD=$(jq -n --arg t "$TITLE" --arg u "$EMBED_URL" '{content: ("📹 Új TikTok videó!\n**" + $t + "**\n" + $u)}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
